services:
  webhook-relay:
    build:
      context: ./services/webhook-relay
    environment:
      TRACEGATE_RELAY_ADMIN_TOKEN: ${TRACEGATE_RELAY_ADMIN_TOKEN:?set a high-entropy 32+ character admin token}
      TRACEGATE_RELAY_GITHUB_SECRET: ${TRACEGATE_RELAY_GITHUB_SECRET:?set a high-entropy 32+ character GitHub webhook secret}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
