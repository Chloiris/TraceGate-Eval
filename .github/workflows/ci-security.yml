name: Security CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Guardrails, secret hygiene, and security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_FROZEN: "true"

    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv 0.11.28
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install ripgrep runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version

      - name: Install frozen dependencies and prepare logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/security
          uv sync --frozen --extra dev 2>&1 | tee .ci-artifacts/security/uv-sync.log

      - name: Scan tracked content for credential material
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/check_secret_hygiene.py 2>&1 | tee .ci-artifacts/security/secrets.log

      - name: Run strict reality guardrail
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m tracegate guardrails scan --strict 2>&1 | tee .ci-artifacts/security/guardrails.log

      - name: Run security-focused tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/test_studio_api.py \
            tests/test_studio_cli.py \
            tests/test_pr_advisor.py \
            tests/test_real_mvp.py 2>&1 | tee .ci-artifacts/security/pytest.log

      - name: Upload security logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-logs-${{ github.run_id }}
          path: .ci-artifacts/security
          if-no-files-found: ignore
          retention-days: 14
